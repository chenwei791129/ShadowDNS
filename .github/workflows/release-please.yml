name: Release

on:
  push:
    branches: [main]

permissions: {}

# Serialize the complete release transaction so a newer release cannot be
# published between the latest-tag guard and update of an older run.
concurrency:
  group: release-workflow
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.MY_RELEASE_PLEASE_TOKEN }}

  build-and-upload:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # The canonical build recipe (scripts/build-linux.sh, driven by
    # `make build-linux`) targets linux/amd64 only, so this job builds exactly
    # one artifact. A build matrix here would advertise architectures the
    # recipe cannot actually produce.
    env:
      BINARY: shadowdns-linux-amd64
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}
        run: |
          make build-linux
          cp "bin/$BINARY" "$BINARY"

      - name: Generate shell completions
        run: make completions

      - name: Build .deb package
        run: go tool nfpm package --packager deb
        env:
          VERSION: ${{ needs.release-please.outputs.tag_name }}

      - name: Upload release artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$BINARY" \
            *.deb \
            --clobber

  build-and-push-image:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The image is built into the local docker daemon, verified against the
    # shared contract script, and only then pushed — release-only build args
    # and metadata must not reach a published tag unverified.
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      CONTAINER_RUNTIME: docker
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image metadata
        id: metadata
        run: |
          echo "source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "created=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/shadowdns" >> "$GITHUB_OUTPUT"

      - name: Build container image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.metadata.outputs.image }}:${{ needs.release-please.outputs.tag_name }}
          build-args: |
            SOURCE=${{ steps.metadata.outputs.source }}
            REVISION=${{ steps.metadata.outputs.revision }}
            VERSION=${{ needs.release-please.outputs.tag_name }}
            CREATED=${{ steps.metadata.outputs.created }}
            SOURCE_DATE_EPOCH=${{ steps.metadata.outputs.source_date_epoch }}

      # Same verifier the Pull Request CI job runs against the dev image, so a
      # release-only drift in identity, entrypoint, ports or OCI labels fails
      # before anything is published.
      - name: Verify container image contract
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          EXPECTED_SOURCE: ${{ steps.metadata.outputs.source }}
          EXPECTED_REVISION: ${{ steps.metadata.outputs.revision }}
          EXPECTED_CREATED: ${{ steps.metadata.outputs.created }}
        run: ./scripts/verify-container-image.sh "$IMAGE:$RELEASE_TAG" "$RELEASE_TAG"

      - name: Push container image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
        run: docker push "$IMAGE:$RELEASE_TAG"

      - name: Point latest at the newest release image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_release=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$latest_release" != "$RELEASE_TAG" ]; then
            echo "Skipping latest: $RELEASE_TAG is not the newest release ($latest_release)"
            exit 0
          fi
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "$IMAGE:latest" \
            "$IMAGE:$RELEASE_TAG"
